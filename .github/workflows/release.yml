name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write   # necessario per creare tag e release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Calcola versione
        id: version
        shell: pwsh
        run: |
          $csproj = 'src/SmtpRelay.Service/SmtpRelay.Service.csproj'
          $base = (Select-Xml -Path $csproj -XPath '//Version').Node.InnerText
          if (-not $base) { $base = '1.0.0' }
          $version = "$base.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versione release: $version"

      - name: Publish self-contained (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/SmtpRelay.Service -c Release -r win-x64 --self-contained true -o publish `
            -p:Version=${{ steps.version.outputs.version }}

      - name: Crea archivio
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath "SmtpRelay-v${{ steps.version.outputs.version }}-win-x64-selfcontained.zip"

      - name: Crea release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SMTP Relay v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: SmtpRelay-v${{ steps.version.outputs.version }}-win-x64-selfcontained.zip
