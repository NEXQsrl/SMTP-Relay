name: Release

# Builds, signs and publishes a release. Started by hand: nothing is published by a simple push.
#
# Needs two repository secrets:
#   SIGN_PFX_BASE64    the code signing certificate (.pfx with the private key), Base64-encoded
#   SIGN_PFX_PASSWORD  the password of the .pfx
# Without them the workflow stops: an unsigned build is never published.
#
# The version is the <Version> of Directory.Build.props; the release is tagged v<Version>.

on:
  workflow_dispatch:

permissions:
  contents: write   # to create the tag and the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText
          if (-not $version) { throw 'Version not found in Directory.Build.props.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Test
        run: dotnet test SMTPRelay.slnx -c Release

      - name: Prepare the signing certificate
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:SIGN_PFX_BASE64) { throw 'The secret SIGN_PFX_BASE64 is not set: an unsigned release is not published.' }
          $path = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "SIGN_PFX=$path" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --yes --no-progress }

      - name: Build the release
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          dotnet msbuild build\Release.proj -restore -t:Release "-p:SignPfx=$env:SIGN_PFX" "-p:SignPfxPassword=$env:SIGN_PFX_PASSWORD" -nologo -v:m
          if ($LASTEXITCODE -ne 0) { throw 'The release build failed.' }

      - name: Verify the setup with the update check of the console
        shell: pwsh
        run: |
          $env:SMTPRELAY_SIGNED_SETUP = (Resolve-Path "artifacts\release\SmtpRelay-Setup-${{ steps.version.outputs.version }}.exe").Path
          dotnet test tests\SmtpRelay.Tests -c Release --no-build --filter "FullyQualifiedName~TheReleaseSetupPassesTheUpdateVerification"
          if ($LASTEXITCODE -ne 0) { throw 'The setup is not signed by the expected publisher.' }

      - name: Remove the signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:SIGN_PFX -and (Test-Path $env:SIGN_PFX)) { Remove-Item $env:SIGN_PFX -Force }

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NEXQ SMTP Relay ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/release/SmtpRelay-Setup-${{ steps.version.outputs.version }}.exe
            artifacts/release/SmtpRelay-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/release/NEXQ-CodeSigning.cer
            artifacts/release/NEXQ-SMTP-RELAY-MIB.txt
            artifacts/release/SHA256SUMS.txt
